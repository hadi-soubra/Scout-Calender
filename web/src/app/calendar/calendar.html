<div class="head">
  <h2>{{ title() }}</h2>
  <div class="nav">
    <button class="arrow" aria-label="Previous month" (click)="prev()">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" /></svg>
    </button>
    <button class="arrow" aria-label="Next month" (click)="next()">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5 13 10l-5.5 5.5" /></svg>
    </button>
  </div>
</div>
<div #host class="grid"></div>
